# 🛡️ Response headers for every site on this box, vendors' own domains included.
#
# Included INSIDE the location blocks as well as at server level, because an
# add_header anywhere in a block discards every header inherited from above —
# and both location blocks already set Cache-Control, so anything declared only
# at server level would silently vanish exactly where it matters most.

# don't let a browser guess a type we didn't declare
add_header X-Content-Type-Options "nosniff" always;
# nothing here is meant to be framed by another site
add_header X-Frame-Options "SAMEORIGIN" always;
# a vendor's page should not leak its full path to whoever they link out to
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# features none of these pages use
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS deliberately short to begin with: a long max-age is a promise a browser
# will hold for that long, and a vendor whose certificate lapses would be locked
# out of their own site until it expired. Raise it once this has settled.
add_header Strict-Transport-Security "max-age=300" always;
