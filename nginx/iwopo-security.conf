# 🛡️ Response headers for every site on this box, vendors' own domains included.
#
# Included INSIDE the location blocks as well as at server level, because an
# add_header anywhere in a block discards every header inherited from above —
# and both location blocks already set Cache-Control, so anything declared only
# at server level would silently vanish exactly where it matters most.

# don't let a browser guess a type we didn't declare
add_header X-Content-Type-Options "nosniff" always;
# nothing here is meant to be framed by another site
add_header X-Frame-Options "SAMEORIGIN" always;
# a vendor's page should not leak its full path to whoever they link out to
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# features none of these pages use
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS deliberately short to begin with: a long max-age is a promise a browser
# will hold for that long, and a vendor whose certificate lapses would be locked
# out of their own site until it expired. Raise it once this has settled.
add_header Strict-Transport-Security "max-age=300" always;

# 🛡️ Content-Security-Policy — ENFORCING.
#
# A CSP tells the browser where a page may load things FROM, so an injected
# script has nowhere to run from and nowhere to send what it steals. It is the
# last line of defence rather than the first, and it is also the header most
# likely to break a site silently — a wrong directive shows as a blank panel or
# a missing font, with the reason only in the console.
#
# It ran in Report-Only first, and every surface was walked with the console
# open before it was allowed to enforce: the marketing page, the vendor panel
# signed in, an album, the client gallery gate, and — the one that would have
# failed silently — a real presigned PUT straight to Cloudflare, which returned
# 200. Nothing was reported on any of them.
#
# ⚠️ If a page ever goes blank or a font disappears after a change here, the
# reason is in the browser console and nowhere else. Put it back to
# Content-Security-Policy-Report-Only, reload the page, and read what it says.
#
# Why each source is here:
#   script-src 'self'           every bundle is served from this origin; there
#                               are no inline scripts and no CDN
#   style-src  'unsafe-inline'  unavoidable: 307 style={{…}} attributes in the
#                               panel, which is how React inline styles work.
#                               Removing it means rewriting all of them.
#   fonts.googleapis.com        the stylesheet, imported from CSS
#   fonts.gstatic.com           the font files that stylesheet then asks for
#   cdn.jsdelivr.net (fonts)    the country-flag emoji polyfill, which Windows
#                               needs because it ships no flag glyphs. Caught by
#                               this policy blocking it — it is font-src only,
#                               and a font cannot execute anything.
#   img-src data: blob:         previews drawn before an upload, and canvas
#                               thumbnails for films
#   connect-src *.r2.cloud...   large films upload STRAIGHT from the browser to
#                               Cloudflare with a presigned URL — without this
#                               every video upload fails
#   frame-ancestors 'none'      stricter than the X-Frame-Options above, and the
#                               directive browsers actually honour now
#   object-src 'none'           no Flash, no applets, nothing embeddable
#   base-uri 'self'             stops an injected <base> redirecting every
#                               relative URL on the page
set $iwopo_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.r2.cloudflarestorage.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'";
add_header Content-Security-Policy $iwopo_csp always;
