server {
    server_name alphabetaone.com www.alphabetaone.com;
    include snippets/iwopo-security.conf;
    root /var/www/iwopo-staging/frontend/dist;
    index index.html;
    client_max_body_size 2048M;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/iwopo-security.conf;
    }

    location / {
        # The SPA shell is returned for every app path and it names the hashed
        # bundle, so it must never be cached — a stale copy pins a returning
        # visitor to an old build. /assets/ above is content-hashed and cached hard.
        add_header Cache-Control "no-cache, must-revalidate" always;
        include snippets/iwopo-security.conf;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alphabetaone.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alphabetaone.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.alphabetaone.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = alphabetaone.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name alphabetaone.com www.alphabetaone.com;
    include snippets/iwopo-security.conf;
    return 404; # managed by Certbot




}