<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 🌗 Paint the right background BEFORE anything loads — no black flash on a
       refresh (Raj, 2026-10-11). The styles start dark and the light theme was
       only switched on by JavaScript once the page had loaded, so every hard
       refresh showed dark first; the sign-up page sat on that same dark base
       until its cream styles arrived. This runs first, sets the panel's
       remembered theme (vf_theme) and the right colour for the page, and steps
       aside once the page's own styles are in. -->
  <script>
    (function () {
      try {
        var d = document.documentElement, p = location.pathname, bg = '';
        var signedIn = !!(sessionStorage.getItem('iwopo_token') || localStorage.getItem('iwopo_token'));
        var light = localStorage.getItem('vf_theme') === 'light';
        if (p.indexOf('/panel') === 0 || ((p === '/' || p === '/login') && signedIn)) {
          if (light) d.setAttribute('data-theme', 'light');
          bg = light ? '#eef2f3' : '#0a1013';
        } else if (p === '/' || p === '/login' || p.indexOf('/inquiry/') === 0) {
          bg = '#FFF7F0';                       // the sign-up / plans page, the inquiry form
        }
        if (bg) {
          // data-boot lets the body show this colour too (index.css) — the body
          // is what you see while the page's code is still downloading
          d.style.setProperty('--boot-bg', bg);
          d.setAttribute('data-boot', '');
          window.addEventListener('load', function () { setTimeout(function () { d.removeAttribute('data-boot'); }, 1500); });
        }
      } catch (e) { /* storage blocked — the page still loads normally */ }
    })();
  </script>
  <link rel="icon" type="image/png" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>iwopo — Run your whole wedding business in one place</title>
  <meta name="description" content="Galleries, contracts, invoices, bookings, crew and a portfolio site for wedding photographers and videographers. Start free.">
  <link rel="canonical" href="https://iwopo.com/">

  <!-- 📱 How the link looks when somebody shares it. For a wedding business
       this matters as much as search: people pass links in WhatsApp and the
       preview is the whole first impression. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="iwopo">
  <meta property="og:title" content="iwopo — Run your whole wedding business in one place">
  <meta property="og:description" content="Galleries, contracts, invoices, bookings, crew and a portfolio site for wedding photographers and videographers. Start free.">
  <meta property="og:url" content="https://iwopo.com/">
  <meta property="og:image" content="https://iwopo.com/og-cover.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 🔎 Tells Google this is software, what it costs and who it is for,
       which is what produces a rich result rather than a plain blue link. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "iwopo",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "url": "https://iwopo.com/",
    "description": "Galleries, contracts, invoices, bookings, crew and a portfolio site for wedding photographers and videographers.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CAD" },
    "publisher": {
      "@type": "Organization",
      "name": "Perfect Poses Media Inc.",
      "url": "https://iwopo.com/"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
